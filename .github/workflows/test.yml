name: 🧪 Test

on:
  push:

jobs:
  test:
    name: 🧪 Test

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version:
            - 22
            - 24

    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v5

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 🔵 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: ⏬ Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔎 Type check
        run: pnpm typecheck

      - name: 🧼 Lint
        run: pnpm lint

      - name: 🧪 Run tests
        run: pnpm test:cov

      - name: 🏗 Build
        run: pnpm build

      - name: 💨 Check build
        run: pnpm build:check
